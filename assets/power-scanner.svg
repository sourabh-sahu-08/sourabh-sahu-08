<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="600" height="250" fill="#0d1117" rx="10"/>
  <rect x="5" y="5" width="590" height="240" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  
  <text x="30" y="35" font-family="monospace" font-size="16" fill="#ffcc00" font-weight="bold">╭──────── POWER SCANNER ────────╮</text>

  <!-- Frontend -->
  <text x="30" y="75" font-family="monospace" font-size="14" fill="#ffffff">Frontend</text>
  <rect x="180" y="65" width="300" height="12" fill="#1f2428" rx="2"/>
  <rect x="180" y="65" width="270" height="12" fill="url(#barGrad)" rx="2" filter="url(#glow)">
    <animate attributeName="width" values="0;270;270" dur="2s" fill="freeze"/>
  </rect>
  <text x="500" y="75" font-family="monospace" font-size="14" fill="#ffcc00">90%</text>

  <!-- Backend -->
  <text x="30" y="105" font-family="monospace" font-size="14" fill="#ffffff">Backend</text>
  <rect x="180" y="95" width="300" height="12" fill="#1f2428" rx="2"/>
  <rect x="180" y="95" width="255" height="12" fill="url(#barGrad)" rx="2" filter="url(#glow)">
    <animate attributeName="width" values="0;255;255" dur="2.2s" fill="freeze"/>
  </rect>
  <text x="500" y="105" font-family="monospace" font-size="14" fill="#ffcc00">85%</text>

  <!-- Database -->
  <text x="30" y="135" font-family="monospace" font-size="14" fill="#ffffff">Database</text>
  <rect x="180" y="125" width="300" height="12" fill="#1f2428" rx="2"/>
  <rect x="180" y="125" width="246" height="12" fill="url(#barGrad)" rx="2" filter="url(#glow)">
    <animate attributeName="width" values="0;246;246" dur="2.4s" fill="freeze"/>
  </rect>
  <text x="500" y="135" font-family="monospace" font-size="14" fill="#ffcc00">82%</text>

  <!-- Problem Solving -->
  <text x="30" y="165" font-family="monospace" font-size="14" fill="#ffffff">Problem Solving</text>
  <rect x="180" y="155" width="300" height="12" fill="#1f2428" rx="2"/>
  <rect x="180" y="155" width="276" height="12" fill="url(#barGrad)" rx="2" filter="url(#glow)">
    <animate attributeName="width" values="0;276;276" dur="2.6s" fill="freeze"/>
  </rect>
  <text x="500" y="165" font-family="monospace" font-size="14" fill="#ffcc00">92%</text>

  <!-- AI Integration -->
  <text x="30" y="195" font-family="monospace" font-size="14" fill="#ffffff">AI Integration</text>
  <rect x="180" y="185" width="300" height="12" fill="#1f2428" rx="2"/>
  <rect x="180" y="185" width="234" height="12" fill="url(#barGrad)" rx="2" filter="url(#glow)">
    <animate attributeName="width" values="0;234;234" dur="2.8s" fill="freeze"/>
  </rect>
  <text x="500" y="195" font-family="monospace" font-size="14" fill="#ffcc00">78%</text>

  <text x="30" y="235" font-family="monospace" font-size="16" fill="#ffcc00" font-weight="bold">
    <tspan>POWER LEVEL: OVER 9000 ⚡</tspan>
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
  </text>
</svg>
