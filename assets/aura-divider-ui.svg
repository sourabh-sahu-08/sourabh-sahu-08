<svg width="800" height="40" viewBox="0 0 800 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradUI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#aa88ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#aa88ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glowUI" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="5%" y="19" width="90%" height="1.5" fill="url(#gradUI)" filter="url(#glowUI)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </rect>
  <circle cx="50%" cy="20" r="3" fill="#ffffff" filter="url(#glowUI)">
    <animate attributeName="r" values="2;4;2" dur="0.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="48%" cy="20" r="1.5" fill="#aa88ff" filter="url(#glowUI)">
    <animate attributeName="r" values="1;2.5;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="52%" cy="20" r="1.5" fill="#aa88ff" filter="url(#glowUI)">
    <animate attributeName="r" values="1;2.5;1" dur="1.4s" repeatCount="indefinite" />
  </circle>
</svg>
